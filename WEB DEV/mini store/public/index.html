<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-Commerce Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .zoom-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .zoom-hover:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <img src="logo.png" alt="CartNova Logo" class="w-16" />
    <div>
      <input id="searchInput" type="text" placeholder="Search products..."
             class="px-2 py-1 rounded text-black" onkeyup="filterProducts()" />
      <button onclick="toggleCart()" class="ml-4 bg-yellow-500 text-black px-3 py-1 rounded">
        🛒 Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- Product Grid -->
  <main id="productGrid" class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></main>

  <!-- Product Specs Modal -->
  <div id="specModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg w-96">
      <h2 id="modalTitle" class="text-xl font-bold mb-2"></h2>
      <img id="modalImage" src="" class="zoom-hover w-full h-40 object-cover mb-4 rounded" />
      <ul id="modalSpecs" class="list-disc pl-5 text-gray-700"></ul>
      <button onclick="closeModal()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Close</button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg w-96">
      <h2 class="text-xl font-bold mb-2">Your Cart</h2>
      <ul id="cartItems" class="list-disc pl-5 text-gray-700"></ul>
      <p id="cartTotal" class="mt-2 font-bold"></p>
      <button onclick="checkout()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded">Checkout</button>
      <button onclick="toggleCart()" class="mt-2 bg-red-600 text-white px-4 py-2 rounded">Close</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg w-96">
      <h2 class="text-xl font-bold mb-2">Checkout</h2>
      <form onsubmit="submitOrder(event)">
        <input type="text" placeholder="Name" required class="w-full mb-2 px-2 py-1 border rounded" />
        <input type="email" placeholder="Email" required class="w-full mb-2 px-2 py-1 border rounded" />
        <input type="text" placeholder="Address" required class="w-full mb-2 px-2 py-1 border rounded" />
        <button type="submit" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded">Place Order</button>
      </form>
    </div>
  </div>

<script>
  const products = [
    { name: 'Wireless Headphones', price: 2999, image: 'pexels-nick-8597722.jpg', specs: ['Bluetooth 5.0', 'Noise Cancellation', '20hr Battery Life', 'Fast Charging', 'Comfort Fit'] },
    { name: 'Smart Watch', price: 4999, image: 'pexels-energepic-com-27411-110471.jpg', specs: ['Heart Rate Monitor', 'GPS', 'Water Resistant', 'Sleep Tracking', 'Customizable Watch Faces'] },
    { name: 'Bluetooth Speaker', price: 1999, image: 'pexels-nejc-soklic-7862643-6023354.jpg', specs: ['10W Output', 'Portable Design', '6hr Battery Life', 'Hands-Free Calling', 'Splash Proof'] },
    { name: 'Gaming Laptop', price: 59999, image: 'pexels-foysal-ahmed-2102283-6053279.jpg', specs: ['Intel i7', '16GB RAM', 'RTX 3060', '512GB SSD', 'RGB Keyboard'] },
    { name: 'DSLR Camera', price: 45999, image: 'pexels-pixabay-51383.jpg', specs: ['24MP', 'Wi-Fi', '4K Video', 'Interchangeable Lens', 'Dual SD Card Slots'] },
    { name: 'Smartphone', price: 159900, image:'pexels-japy-29020349.jpg', specs: ['6.5" Display', '128GB Storage', '5000mAh Battery', 'Triple Camera Setup', '5G Support'] },
    { name: 'Tablet', price: 19999, image: 'pexels-asphotography-106341.jpg', specs: ['10" Display', '64GB Storage', 'Stylus Support', 'Split-Screen Multitasking', 'Quad Speakers'] },
    { name: 'Wireless Mouse', price: 999, image: 'pexels-bertellifotografia-13870517.jpg', specs: ['Ergonomic', 'Rechargeable', '2.4GHz', 'Silent Clicks', 'Adjustable DPI'] },
    { name: 'Mechanical Keyboard', price: 3499, image: 'pexels-marcellino-andrian-209361-671629.jpg', specs: ['RGB Lighting', 'Blue Switches', 'USB-C', 'Anti-Ghosting', 'Durable Build'] },
    { name: 'Smart TV', price: 39999, image: 'pexels-han-798356342-33941646.jpg', specs: ['55" 4K', 'HDR', 'Android OS', 'Voice Control', 'Multiple HDMI Ports'] }
  ];

  let cart = [];

  function renderProducts(list = products) {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    if (list.length === 0) {
      grid.innerHTML = `<p class="col-span-full text-center text-red-600 font-bold">Product not found</p>`;
      return;
    }
    list.forEach((product, index) => {
      const card = document.createElement('div');
      card.className = "bg-white rounded-lg shadow p-4";
      card.innerHTML = `
        <img src="${product.image}" class="zoom-hover w-full h-48 object-cover rounded cursor-pointer" onclick="showSpecs(${index})" />
        <h3 class="mt-2 font-semibold">${product.name}</h3>
        <p class="text-green-600 font-bold">₹${product.price}</p>
        <button onclick="addToCart(${index})" class="mt-2 bg-yellow-500 text-black px-3 py-1 rounded">Add to Cart</button>
      `;
      grid.appendChild(card);
    });
  }

  function showSpecs(index) {
    const product = products[index];
    document.getElementById('modalTitle').textContent = product.name;
    document.getElementById('modalImage').src = product.image;
    const specsList = document.getElementById('modalSpecs');
    specsList.innerHTML = '';
    product.specs.forEach(spec => {
      const li = document.createElement('li');
      li.textContent = spec;
      specsList.appendChild(li);
    });
    document.getElementById('specModal').classList.remove('hidden');
    document.getElementById('specModal').classList.add('flex');
  }

  function closeModal() {
    const modal = document.getElementById('specModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function addToCart(index) {
    cart.push(products[index]);
    document.getElementById('cartCount').textContent = cart.length;
  }

  function removeFromCart(i) {
    cart.splice(i, 1);
    document.getElementById('cartCount').textContent = cart.length;
    renderCart();
  }

  function toggleCart() {
    const modal = document.getElementById('cartModal');
    if (modal.classList.contains('hidden')) {
      renderCart();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    } else {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  function renderCart() {
    const list = document.getElementById('cartItems');
    list.innerHTML = '';
    let total = 0;
    cart.forEach((item, i) => {
      const li = document.createElement('li');
      li.className = "flex justify-between items-center";
      li.innerHTML = `
        <span>${item.name} - ₹${item.price}</span>
        <button onclick="removeFromCart(${i})" class="ml-4 bg-red-500 text-white px-2 py-1 rounded">Remove</button>
      `;
      list.appendChild(li);
      total += item.price;
    });
    document.getElementById('cartTotal').textContent = "Total: ₹" + total;
  }

  function checkout() {
    document.getElementById('cartModal').classList.add('hidden');
    document.getElementById('cartModal').classList.remove('flex');
    document.getElementById('checkoutModal').classList.remove('hidden');
    document.getElementById('checkoutModal').classList.add('flex');
  }

 async function submitOrder(event) {
  event.preventDefault();

  const order = {
    name: document.querySelector('input[placeholder="Name"]').value,
    email: document.querySelector('input[placeholder="Email"]').value,
    address: document.querySelector('input[placeholder="Address"]').value,
    items: cart,
    total: cart.reduce((sum, item) => sum + item.price, 0),
  };

  try {
    const res = await fetch("/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order),
    });

    const data = await res.json();
    alert(data.message);

    // Reset cart
    cart = [];
    document.getElementById("cartCount").textContent = 0;
    document.getElementById("cartItems").innerHTML = '';
    document.getElementById("cartTotal").textContent = '';
    event.target.reset();

    // Close modal
    document.getElementById("checkoutModal").classList.add("hidden");
    document.getElementById("checkoutModal").classList.remove("flex");
  } catch (err) {
    console.error("Order failed:", err);
    alert("Order failed. Please try again.");
  }
}

  function filterProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = products.filter(p => p.name.toLowerCase().includes(query));
    renderProducts(filtered);
  }

  // Initial render
  renderProducts();
</script>
